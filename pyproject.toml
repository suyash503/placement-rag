[project]
name = "placement-rag"
version = "1.0.0"
description = "Hybrid-retrieval RAG assistant over college placement records (MongoDB Atlas + Gemini + LangChain)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # --- API layer ---
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sse-starlette>=2.1.3",
    # --- Vector store / database ---
    "pymongo>=4.10.0",
    "certifi>=2024.8.30",
    # --- RAG orchestration ---
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-mongodb>=0.6.0",
    "langchain-huggingface>=0.1.0",
    "langchain-text-splitters>=0.3.0",
    "langchain-google-genai>=2.0.0",
    # --- Embeddings + reranking (both are sentence-transformers models) ---
    "sentence-transformers>=3.2.0",
    # --- Data / loaders ---
    "pandas>=2.2.0",
    "pypdf>=5.0.0",
    "openpyxl>=3.1.5",
    "python-dotenv>=1.0.1",
    # --- CLI ergonomics for the scripts ---
    "rich>=13.9.0",
]

[dependency-groups]
dev = [
    "ruff>=0.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.uv]
package = false
